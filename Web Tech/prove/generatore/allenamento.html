<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allenamento Tecnologie Web</title>
<style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #efede6;
  --text: #1d1d1b;
  --muted: #62625c;
  --border: #d8d5cb;
  --accent: #1f4e8c;
  --accent-soft: #e3ebf6;
  --accent-text: #ffffff;
  --ok: #1d7a3e;
  --ok-soft: #e1f2e6;
  --err: #b3261e;
  --err-soft: #f9e3e1;
  --warn: #8a5a00;
  --warn-soft: #fbf0d6;
  --code-bg: #fbfaf7;
  --code-border: #cfcbbf;
  --num: #8a877c;
  --hl-k: #1a3fb0;
  --hl-s: #b3261e;
  --hl-c: #7a786f;
  --hl-t: #1a3fb0;
  --hl-a: #7a3e9d;
  --hl-p: #1a3fb0;
  --hl-n: #0f6b5f;
  --hl-v: #7a3e9d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 10px rgba(0, 0, 0, .04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16171a;
    --surface: #1f2125;
    --surface-2: #2a2d32;
    --text: #e9e8e4;
    --muted: #a3a29c;
    --border: #3a3d44;
    --accent: #8db4ec;
    --accent-soft: #23324a;
    --accent-text: #0f1520;
    --ok: #6fcf8f;
    --ok-soft: #1c3426;
    --err: #f08a80;
    --err-soft: #3d2120;
    --warn: #e9b65c;
    --warn-soft: #3a2f17;
    --code-bg: #191b1e;
    --code-border: #3a3d44;
    --num: #7d7c76;
    --hl-k: #8db4ec;
    --hl-s: #f0968c;
    --hl-c: #8c8b84;
    --hl-t: #8db4ec;
    --hl-a: #d1a3ec;
    --hl-p: #8db4ec;
    --hl-n: #7fd3c3;
    --hl-v: #d1a3ec;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  --bg: #16171a;
  --surface: #1f2125;
  --surface-2: #2a2d32;
  --text: #e9e8e4;
  --muted: #a3a29c;
  --border: #3a3d44;
  --accent: #8db4ec;
  --accent-soft: #23324a;
  --accent-text: #0f1520;
  --ok: #6fcf8f;
  --ok-soft: #1c3426;
  --err: #f08a80;
  --err-soft: #3d2120;
  --warn: #e9b65c;
  --warn-soft: #3a2f17;
  --code-bg: #191b1e;
  --code-border: #3a3d44;
  --num: #7d7c76;
  --hl-k: #8db4ec;
  --hl-s: #f0968c;
  --hl-c: #8c8b84;
  --hl-t: #8db4ec;
  --hl-a: #d1a3ec;
  --hl-p: #8db4ec;
  --hl-n: #7fd3c3;
  --hl-v: #d1a3ec;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
code, pre, .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
[hidden] { display: none !important; }

.pagina { max-width: 980px; margin: 0 auto; padding: 0 16px 64px; }
header.testata {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 20px 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
header.testata h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
header.testata .sotto { color: var(--muted); font-size: .9rem; }
.strumenti { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.bottone {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
  padding: 8px 14px; cursor: pointer; line-height: 1.2;
}
.bottone:hover { border-color: var(--accent); }
.bottone:focus-visible, .opzione:focus-visible, .chip input:focus-visible + span {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.bottone.primario { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.bottone.piccolo { padding: 4px 10px; font-size: .88rem; }
.bottone:disabled { opacity: .5; cursor: not-allowed; }

.scheda {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 18px;
}
.scheda h2 { font-size: 1.05rem; margin: 0 0 12px; }
.nota { color: var(--muted); font-size: .9rem; }

/* impostazioni */
.capitoli { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 8px; }
.chip { display: block; cursor: pointer; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span {
  display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: baseline;
  border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; background: var(--surface);
  min-height: 100%;
}
.chip b { font-variant-numeric: tabular-nums; color: var(--muted); }
.chip small { grid-column: 2; color: var(--muted); font-size: .78rem; }
.chip input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.chip input:checked + span b { color: var(--accent); }
.riga-bottoni { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
.modi { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; width: fit-content; max-width: 100%; }
.modi label { padding: 8px 14px; cursor: pointer; background: var(--surface); }
.modi input { position: absolute; opacity: 0; pointer-events: none; }
.modi label:has(input:checked) { background: var(--accent); color: var(--accent-text); font-weight: 600; }
.modi label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -3px; }
.campi { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 14px; align-items: center; }
.campi label { display: inline-flex; align-items: center; gap: 8px; }
.campi input[type=number] { width: 4.5em; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
.disponibili { margin-top: 14px; font-size: .92rem; }
.disponibili strong { font-variant-numeric: tabular-nums; }

/* domanda */
.barra-sessione {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap;
}
.barra-sessione .stato { font-variant-numeric: tabular-nums; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; }
.timer.poco { color: var(--err); }
.avanzamento { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; flex: 1 1 120px; min-width: 80px; }
.avanzamento > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }

.domanda { scroll-margin-top: 70px; }
.intestazione { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-bottom: 10px; font-size: .85rem; }
.etichetta { border-radius: 999px; padding: 2px 9px; background: var(--surface-2); color: var(--muted); }
.etichetta.cap { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.etichetta.trab { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.etichetta.fonte { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.numero { font-weight: 700; margin-right: 4px; }
.testo p { margin: 0 0 8px; }
.testo code, .opzione code, .spiegazione code, .traccia code {
  background: var(--surface-2); border-radius: 4px; padding: 0 4px; font-size: .9em;
  white-space: break-spaces; overflow-wrap: anywhere;
}
.listati { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 10px; margin: 10px 0; }
pre.listato {
  margin: 0; background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 6px;
  padding: 8px 10px 8px 0; overflow-x: auto; font-size: .84rem; line-height: 1.5;
}
pre.listato code { display: block; min-width: max-content; }
pre.listato .riga { display: block; min-height: 1.5em; padding-left: 3.1em; position: relative; white-space: pre; }
pre.listato .riga::before {
  content: attr(data-n); position: absolute; left: 0; width: 2.3em; text-align: right;
  color: var(--num); user-select: none;
}
pre.listato .k { color: var(--hl-k); font-weight: 700; }
pre.listato .s { color: var(--hl-s); }
pre.listato .c { color: var(--hl-c); font-style: italic; }
pre.listato .t { color: var(--hl-t); font-weight: 700; }
pre.listato .a { color: var(--hl-a); }
pre.listato .p { color: var(--hl-p); font-weight: 700; }
pre.listato .n { color: var(--hl-n); }
pre.listato .v { color: var(--hl-v); }

.opzioni { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 7px; }
.opzione {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; width: 100%;
  text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; cursor: pointer;
}
.opzione:hover:not(:disabled) { border-color: var(--accent); }
.opzione .lettera {
  width: 1.55em; height: 1.55em; border: 1.5px solid var(--text); border-radius: 3px;
  display: inline-grid; place-items: center; font-size: .8rem; font-weight: 700; margin-top: .05em;
}
.opzione[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opzione[aria-pressed="true"] .lettera { background: var(--text); color: var(--surface); }
.opzione .esito { font-weight: 700; font-size: .85rem; white-space: nowrap; }
.opzione:disabled { cursor: default; opacity: 1; }
.opzione.giusta-presa { border-color: var(--ok); background: var(--ok-soft); }
.opzione.giusta-persa { border-color: var(--ok); border-style: dashed; }
.opzione.sbagliata-presa { border-color: var(--err); background: var(--err-soft); }
.opzione.giusta-presa .esito, .opzione.giusta-persa .esito { color: var(--ok); }
.opzione.sbagliata-presa .esito { color: var(--err); }

.azioni { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.punteggio { font-weight: 700; font-variant-numeric: tabular-nums; }
.punteggio.pieno { color: var(--ok); }
.punteggio.parziale { color: var(--warn); }
.punteggio.zero { color: var(--err); }

.spiegazione, .traccia {
  margin-top: 12px; border-left: 3px solid var(--accent); background: var(--surface-2);
  border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: .95rem;
}
.spiegazione p { margin: 0 0 6px; }
.spiegazione .rif, .traccia .rif { color: var(--muted); font-style: italic; font-size: .88rem; }
.traccia ul { margin: 6px 0; padding-left: 20px; }
textarea.risposta {
  width: 100%; min-height: 8.5em; margin-top: 10px; padding: 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface); resize: vertical; line-height: 1.5;
}
.voto { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.voto .bottone[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

/* risultati */
.totale { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; margin: 4px 0; }
table.riepilogo { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.riepilogo th, table.riepilogo td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
table.riepilogo td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabella-scorre { overflow-x: auto; }
.esame-intestazione { border: 1.5px solid var(--text); padding: 10px 12px; font-size: .9rem; border-radius: 4px; margin-bottom: 16px; background: var(--surface); }

@media (max-width: 560px) {
  header.testata { flex-direction: column; align-items: flex-start; }
  .strumenti { justify-content: flex-start; }
  .scheda { padding: 14px 14px; }
  .opzione { grid-template-columns: auto 1fr; }
  .opzione .esito { grid-column: 2; }
}
@media print {
  body { background: #fff; color: #000; }
  .strumenti, .barra-sessione, .azioni, #impostazioni, .no-stampa { display: none !important; }
  .scheda { box-shadow: none; border: none; padding: 0; break-inside: avoid; }
  .opzione { border: none; padding: 2px 0; }
  pre.listato { white-space: pre-wrap; }
}
</style>
</head>
<body>
<div class="pagina">
  <header class="testata">
    <div>
      <h1>Allenamento · Tecnologie Web</h1>
      <div class="sotto" id="sottotitolo"></div>
    </div>
    <div class="strumenti">
      <button class="bottone piccolo" id="tema" type="button" title="Cambia tema">Tema scuro</button>
    </div>
  </header>

  <main>
    <section id="impostazioni">
      <div class="scheda">
        <h2>1. Scegli i capitoli</h2>
        <div class="capitoli" id="capitoli"></div>
        <div class="riga-bottoni">
          <button class="bottone piccolo" type="button" data-scelta="tutti">Tutti</button>
          <button class="bottone piccolo" type="button" data-scelta="nessuno">Nessuno</button>
          <button class="bottone piccolo" type="button" data-scelta="1-8">1–8</button>
          <button class="bottone piccolo" type="button" data-scelta="9-16">9–16</button>
          <button class="bottone piccolo" type="button" data-scelta="17-20">17–20</button>
        </div>
      </div>

      <div class="scheda">
        <h2>2. Scegli come allenarti</h2>
        <div class="modi" role="radiogroup" aria-label="Modalità">
          <label><input type="radio" name="modo" value="allenamento" checked> Allenamento</label>
          <label><input type="radio" name="modo" value="simulazione"> Simulazione d'esame</label>
        </div>
        <p class="nota" id="descrizione-modo"></p>
        <div class="campi" id="campi-allenamento">
          <label>Domande <input type="number" id="quante" min="1" max="200" value="10"></label>
          <label><input type="checkbox" id="con-aperte"> anche domande aperte</label>
        </div>
        <div class="campi" id="campi-simulazione" hidden>
          <label>Chiuse (2 punti) <input type="number" id="n-chiuse" min="0" max="40" value="8"></label>
          <label>Aperte (5 punti) <input type="number" id="n-aperte" min="0" max="10" value="3"></label>
          <label>Minuti <input type="number" id="minuti" min="1" max="300" value="45"></label>
        </div>
        <div class="campi">
          <label><input type="checkbox" id="solo-trab"> solo domande a trabocchetto</label>
          <label><input type="checkbox" id="solo-fonte"> solo domande delle prove del corso</label>
          <label><input type="checkbox" id="non-viste" checked> prima quelle che non ho ancora visto</label>
        </div>
        <div class="disponibili" id="disponibili"></div>
        <div class="azioni">
          <button class="bottone primario" type="button" id="inizia">Inizia</button>
          <button class="bottone piccolo" type="button" id="azzera">Azzera le statistiche</button>
        </div>
      </div>
      <p class="nota">Le domande vengono dalla banca del generatore di prove, verificata eseguendo davvero il codice
        (Node, Chromium, Express, TypeScript, Sass). Le statistiche restano solo in questo browser.</p>
    </section>

    <section id="sessione" hidden>
      <div class="barra-sessione">
        <span class="stato" id="stato"></span>
        <div class="avanzamento" aria-hidden="true"><i id="barra"></i></div>
        <span class="timer" id="timer" hidden></span>
        <span class="punteggio" id="parziale"></span>
        <button class="bottone piccolo" type="button" id="stampa" hidden>Stampa</button>
        <button class="bottone piccolo" type="button" id="esci">Esci</button>
      </div>
      <div id="contenuto"></div>
    </section>

    <section id="risultati" hidden></section>
  </main>
</div>

<script type="application/json" id="dati">@@DATI@@</script>
<script>
"use strict";
const DATI = JSON.parse(document.getElementById("dati").textContent);
const CHIAVE = "allenamento-tecnologie-web-v1";
const LETTERE = "ABCDEFGHIJ";
const $ = (sel, radice = document) => radice.querySelector(sel);
const $$ = (sel, radice = document) => Array.from(radice.querySelectorAll(sel));

// ---------------------------------------------------------------- memoria
function leggiMemoria() {
  try {
    const m = JSON.parse(localStorage.getItem(CHIAVE) || "{}");
    return { stat: m.stat || {}, imp: m.imp || null };
  } catch (e) {
    return { stat: {}, imp: null };
  }
}
const memoria = leggiMemoria();
function salvaMemoria() {
  try { localStorage.setItem(CHIAVE, JSON.stringify(memoria)); } catch (e) { /* niente */ }
}
function registra(id, corretta) {
  const s = memoria.stat[id] || [0, 0];
  s[0] += 1;
  if (corretta) s[1] += 1;
  memoria.stat[id] = s;
  salvaMemoria();
}

// ---------------------------------------------------------------- utilità
function casuale(n) { return Math.floor(Math.random() * n); }
function scegli(lista) { return lista[casuale(lista.length)]; }
function mescola(lista) {
  const a = lista.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = casuale(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function numero(x) { return (Math.round(x * 100) / 100).toLocaleString("it-IT", { maximumFractionDigits: 2 }); }
function elemento(tag, attributi = {}, html = "") {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attributi)) {
    if (k === "class") e.className = v; else e.setAttribute(k, v);
  }
  if (html) e.innerHTML = html;
  return e;
}

// ---------------------------------------------------------------- tema
function applicaTema(tema) {
  if (tema) document.documentElement.setAttribute("data-theme", tema);
  const scuro = tema ? tema === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("#tema").textContent = scuro ? "Tema chiaro" : "Tema scuro";
}
let temaScelto = null;
try { temaScelto = localStorage.getItem(CHIAVE + "-tema"); } catch (e) { /* niente */ }
applicaTema(temaScelto);
$("#tema").addEventListener("click", () => {
  const scuro = document.documentElement.getAttribute("data-theme") === "dark" ||
    (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const nuovo = scuro ? "light" : "dark";
  try { localStorage.setItem(CHIAVE + "-tema", nuovo); } catch (e) { /* niente */ }
  applicaTema(nuovo);
});

// ---------------------------------------------------------------- impostazioni
const capitoli = Object.keys(DATI.capitoli).map(Number).sort((a, b) => a - b);
const perCapitolo = {};
for (const d of DATI.domande) (perCapitolo[d.cap] = perCapitolo[d.cap] || []).push(d);

$("#sottotitolo").textContent = DATI.domande.length + " domande su " + capitoli.length +
  " capitoli · " + DATI.domande.filter((d) => d.x).length + " a trabocchetto · banca del " + DATI.generato;

function statCapitolo(c) {
  let viste = 0, giuste = 0;
  for (const d of perCapitolo[c] || []) {
    const s = memoria.stat[d.id];
    if (s) { viste += 1; if (s[1] === s[0]) giuste += 1; }
  }
  return { viste, giuste };
}
function disegnaCapitoli() {
  const contenitore = $("#capitoli");
  const scelti = new Set($$("#capitoli input:checked").map((i) => Number(i.value)));
  const primaVolta = contenitore.children.length === 0;
  contenitore.innerHTML = "";
  for (const c of capitoli) {
    const s = statCapitolo(c);
    const tot = (perCapitolo[c] || []).length;
    const extra = s.viste ? " · viste " + s.viste + "/" + tot : "";
    const chip = elemento("label", { class: "chip" });
    const input = elemento("input", { type: "checkbox", value: String(c) });
    input.checked = primaVolta ? true : scelti.has(c);
    input.addEventListener("change", aggiornaDisponibili);
    const span = elemento("span");
    span.innerHTML = "<b>" + c + "</b><div>" + DATI.capitoli[c] + "</div><small>" + tot +
      " domande" + extra + "</small>";
    chip.append(input, span);
    contenitore.append(chip);
  }
}
function capitoliScelti() { return $$("#capitoli input:checked").map((i) => Number(i.value)); }

function filtra() {
  const scelti = new Set(capitoliScelti());
  const trab = $("#solo-trab").checked, fonte = $("#solo-fonte").checked;
  return DATI.domande.filter((d) => scelti.has(d.cap) && (!trab || d.x) && (!fonte || d.f));
}
function aggiornaDisponibili() {
  const pool = filtra();
  const chiuse = pool.filter((d) => !d.a).length, aperte = pool.filter((d) => d.a).length;
  $("#disponibili").innerHTML = "Con queste scelte: <strong>" + chiuse + "</strong> domande chiuse e <strong>" +
    aperte + "</strong> aperte.";
  $("#inizia").disabled = chiuse + aperte === 0;
}
function aggiornaModo() {
  const sim = $("input[name=modo]:checked").value === "simulazione";
  $("#campi-allenamento").hidden = sim;
  $("#campi-simulazione").hidden = !sim;
  $("#descrizione-modo").textContent = sim
    ? "Una prova completa come all'esame: domande chiuse ordinate per capitolo, poi le aperte, con il tempo che scorre. Correzione alla consegna."
    : "Una domanda alla volta, con la correzione e la spiegazione subito dopo ogni risposta.";
}
$$("input[name=modo]").forEach((r) => r.addEventListener("change", aggiornaModo));
["#solo-trab", "#solo-fonte"].forEach((s) => $(s).addEventListener("change", aggiornaDisponibili));
$$("[data-scelta]").forEach((b) => b.addEventListener("click", () => {
  const scelta = b.dataset.scelta;
  let [da, a] = scelta === "tutti" ? [1, 99] : scelta === "nessuno" ? [0, -1] : scelta.split("-").map(Number);
  $$("#capitoli input").forEach((i) => { const c = Number(i.value); i.checked = c >= da && c <= a; });
  aggiornaDisponibili();
}));
$("#azzera").addEventListener("click", () => {
  if (!confirm("Azzerare le statistiche delle domande viste?")) return;
  memoria.stat = {};
  salvaMemoria();
  disegnaCapitoli();
});

function salvaImpostazioni() {
  memoria.imp = {
    capitoli: capitoliScelti(), modo: $("input[name=modo]:checked").value,
    quante: $("#quante").value, conAperte: $("#con-aperte").checked,
    chiuse: $("#n-chiuse").value, aperte: $("#n-aperte").value, minuti: $("#minuti").value,
    trab: $("#solo-trab").checked, fonte: $("#solo-fonte").checked, nonViste: $("#non-viste").checked,
  };
  salvaMemoria();
}
function ripristinaImpostazioni() {
  const imp = memoria.imp;
  if (!imp) return;
  const scelti = new Set(imp.capitoli || []);
  $$("#capitoli input").forEach((i) => { i.checked = scelti.has(Number(i.value)); });
  const modo = $("input[name=modo][value=" + (imp.modo === "simulazione" ? "simulazione" : "allenamento") + "]");
  if (modo) modo.checked = true;
  if (imp.quante) $("#quante").value = imp.quante;
  $("#con-aperte").checked = !!imp.conAperte;
  if (imp.chiuse) $("#n-chiuse").value = imp.chiuse;
  if (imp.aperte) $("#n-aperte").value = imp.aperte;
  if (imp.minuti) $("#minuti").value = imp.minuti;
  $("#solo-trab").checked = !!imp.trab;
  $("#solo-fonte").checked = !!imp.fonte;
  $("#non-viste").checked = imp.nonViste !== false;
}

// ---------------------------------------------------------------- selezione
function ordinaPerNovita(lista) {
  const nonViste = $("#non-viste").checked;
  const conChiave = mescola(lista).map((d) => {
    const s = memoria.stat[d.id];
    let chiave = 0;
    if (nonViste && s) chiave = s[1] === s[0] ? 2 : 1;   // prima mai viste, poi sbagliate, poi giuste
    return [chiave, d];
  });
  conChiave.sort((x, y) => x[0] - y[0]);
  return conChiave.map((x) => x[1]);
}
function pescaPesata(pool, quante, evita) {
  // come il generatore: i capitoli ruotano secondo il loro peso, una domanda per volta
  const perCap = {};
  for (const d of ordinaPerNovita(pool)) (perCap[d.cap] = perCap[d.cap] || []).push(d);
  const credito = {}, usati = {};
  for (const c of Object.keys(perCap)) { credito[c] = Math.random(); usati[c] = 0; }
  const scelte = [];
  while (scelte.length < quante) {
    const disponibili = Object.keys(perCap).filter((c) => perCap[c].length);
    if (!disponibili.length) break;
    const totale = disponibili.reduce((s, c) => s + (DATI.pesi[c] || 1), 0);
    for (const c of disponibili) credito[c] += (DATI.pesi[c] || 1) / totale;
    disponibili.sort((a, b) => (usati[a] - usati[b]) ||
      ((credito[b] - (evita.has(Number(b)) ? 0.75 : 0)) - (credito[a] - (evita.has(Number(a)) ? 0.75 : 0))));
    const c = disponibili[0];
    usati[c] += 1;
    credito[c] -= 1;
    scelte.push(perCap[c].shift());
  }
  return scelte;
}
function prepara(voce) {
  const q = { voce, id: voce.id, cap: voce.cap, punti: voce.p, aperta: !!voce.a };
  if (voce.a) {
    q.testo = voce.t; q.codice = voce.c; q.traccia = voce.tr;
    return q;
  }
  const variante = scegli(voce.v);
  const istanza = scegli(variante.i);
  q.testo = variante.t; q.codice = variante.c; q.dopo = variante.d; q.spiegazione = variante.s;
  q.opzioni = istanza.map((i) => ({ html: variante.o[i], giusta: i < variante.g, nessuna: i >= variante.o.length - (variante.n ? 1 : 0) && !!variante.n }));
  const ce = q.opzioni.some((o) => o.giusta);
  for (const o of q.opzioni) if (o.nessuna) o.giusta = !ce;
  return q;
}

// ---------------------------------------------------------------- sessione
let sessione = null;

function inizia(domande, modo, minuti) {
  sessione = { domande, modo, indice: 0, minuti, fine: null, consegnata: false, intervallo: null };
  $("#impostazioni").hidden = true;
  $("#risultati").hidden = true;
  $("#sessione").hidden = false;
  $("#stampa").hidden = modo !== "simulazione";
  if (modo === "simulazione") disegnaSimulazione(); else disegnaAllenamento();
  window.scrollTo(0, 0);
}
$("#inizia").addEventListener("click", () => {
  salvaImpostazioni();
  const pool = filtra();
  const chiuse = pool.filter((d) => !d.a), aperte = pool.filter((d) => d.a);
  const modo = $("input[name=modo]:checked").value;
  let scelte;
  if (modo === "simulazione") {
    const nc = Math.max(0, Number($("#n-chiuse").value) || 0), na = Math.max(0, Number($("#n-aperte").value) || 0);
    const sc = pescaPesata(chiuse, nc, new Set());
    const sa = pescaPesata(aperte, na, new Set(sc.map((d) => d.cap)));
    sc.sort((a, b) => a.cap - b.cap);
    sa.sort((a, b) => a.cap - b.cap);
    scelte = sc.concat(sa);
    if (scelte.length < nc + na) alert("Con i filtri scelti ci sono solo " + scelte.length + " domande: la prova sarà più corta.");
    inizia(scelte.map(prepara), modo, Math.max(1, Number($("#minuti").value) || 45));
  } else {
    const n = Math.max(1, Number($("#quante").value) || 10);
    const base = $("#con-aperte").checked ? pool : chiuse;
    if (!base.length) { alert("Con i filtri scelti non ci sono domande chiuse: spunta «anche domande aperte»."); return; }
    scelte = ordinaPerNovita(base).slice(0, n);
    inizia(scelte.map(prepara), modo, 0);
  }
});
$("#esci").addEventListener("click", () => {
  if (sessione && !sessione.consegnata && sessione.modo === "simulazione" &&
      !confirm("Uscire dalla prova senza consegnarla?")) return;
  chiudiSessione();
});
$("#stampa").addEventListener("click", () => window.print());

function chiudiSessione() {
  if (sessione && sessione.intervallo) clearInterval(sessione.intervallo);
  sessione = null;
  $("#sessione").hidden = true;
  $("#risultati").hidden = true;
  $("#impostazioni").hidden = false;
  disegnaCapitoli();
  aggiornaDisponibili();
  window.scrollTo(0, 0);
}

// costruzione di una domanda (comune alle due modalità)
function costruisciDomanda(q, numero) {
  const box = elemento("article", { class: "scheda domanda", id: "d" + numero });
  const intest = elemento("div", { class: "intestazione" });
  intest.append(elemento("span", { class: "numero" }, "Es. " + numero + " <span class=\"nota\">(" + q.punti + " punti)</span>"));
  intest.append(elemento("span", { class: "etichetta cap" }, "cap. " + q.cap));
  intest.append(elemento("span", { class: "etichetta" }, q.voce.tema));
  if (q.voce.x) intest.append(elemento("span", { class: "etichetta trab" }, "trabocchetto"));
  if (q.voce.f) intest.append(elemento("span", { class: "etichetta fonte" }, "prova del corso"));
  box.append(intest);
  box.append(elemento("div", { class: "testo" }, q.testo));
  if (q.codice && q.codice.length) box.append(elemento("div", { class: "listati" }, q.codice.join("")));
  if (q.dopo) box.append(elemento("div", { class: "testo" }, q.dopo));
  q.scelte = q.scelte || new Set();
  if (q.aperta) {
    const area = elemento("textarea", { class: "risposta", "aria-label": "La tua risposta", placeholder: "Scrivi qui la tua risposta (non viene corretta automaticamente: alla fine la confronterai con la traccia)." });
    area.value = q.testoRisposta || "";
    area.addEventListener("input", () => { q.testoRisposta = area.value; });
    box.append(area);
  } else {
    const lista = elemento("div", { class: "opzioni", role: "group", "aria-label": "Opzioni" });
    q.opzioni.forEach((o, i) => {
      const b = elemento("button", { class: "opzione", type: "button", "aria-pressed": q.scelte.has(i) ? "true" : "false" });
      b.innerHTML = "<span class=\"lettera\">" + LETTERE[i] + "</span><span>" + o.html + "</span><span class=\"esito\"></span>";
      b.addEventListener("click", () => {
        if (q.corretta) return;
        if (q.scelte.has(i)) q.scelte.delete(i); else q.scelte.add(i);
        b.setAttribute("aria-pressed", q.scelte.has(i) ? "true" : "false");
        if (sessione && sessione.modo === "simulazione") aggiornaStato();
      });
      lista.append(b);
    });
    box.append(lista);
  }
  return box;
}

function punteggioChiusa(q) {
  const giuste = q.opzioni.filter((o) => o.giusta).length || 1;
  const valore = q.punti / giuste;
  let p = 0;
  q.scelte.forEach((i) => { p += q.opzioni[i].giusta ? valore : -valore; });
  return Math.max(0, p);
}

function correggi(q, box) {
  q.corretta = true;
  const pulsanti = $$(".opzione", box);
  q.opzioni.forEach((o, i) => {
    const b = pulsanti[i];
    b.disabled = true;
    const presa = q.scelte.has(i);
    if (o.giusta && presa) { b.classList.add("giusta-presa"); $(".esito", b).textContent = "✓ giusta"; }
    else if (o.giusta) { b.classList.add("giusta-persa"); $(".esito", b).textContent = "giusta, non presa"; }
    else if (presa) { b.classList.add("sbagliata-presa"); $(".esito", b).textContent = "✗ sbagliata"; }
  });
  q.punteggio = punteggioChiusa(q);
  const lettere = q.opzioni.map((o, i) => (o.giusta ? LETTERE[i] : null)).filter(Boolean);
  const classe = q.punteggio >= q.punti - 1e-9 ? "pieno" : q.punteggio > 0 ? "parziale" : "zero";
  const spieg = elemento("div", { class: "spiegazione" });
  spieg.innerHTML = "<p><span class=\"punteggio " + classe + "\">" + numero(q.punteggio) + " / " + q.punti +
    " punti</span> · " + (lettere.length > 1 ? "Risposte giuste: " : "Risposta giusta: ") + lettere.join(", ") + "</p>" +
    q.spiegazione + rifFonte(q.voce);
  box.append(spieg);
  registra(q.id, q.punteggio >= q.punti - 1e-9);
}
function rifFonte(voce) {
  let s = "";
  if (voce.r) s += "<p class=\"rif\">Dispensa: " + voce.r + "</p>";
  if (voce.f) s += "<p class=\"rif\">Fonte: " + voce.f + "</p>";
  return s;
}
function mostraTraccia(q, box, poi) {
  if ($(".traccia", box)) return;
  const t = elemento("div", { class: "traccia" });
  t.innerHTML = "<strong>Traccia della risposta</strong><ul>" + q.traccia.map((p) => "<li>" + p + "</li>").join("") +
    "</ul>" + rifFonte(q.voce) + "<div class=\"voto\"><span>Quanti punti ti daresti?</span></div>";
  const voto = $(".voto", t);
  for (let v = 0; v <= q.punti; v++) {
    const b = elemento("button", { class: "bottone piccolo", type: "button", "aria-pressed": q.punteggio === v ? "true" : "false" }, String(v));
    b.addEventListener("click", () => {
      q.punteggio = v;
      $$(".bottone", voto).forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      if (!q.registrata) { registra(q.id, v >= q.punti); q.registrata = true; }
      if (poi) poi();
    });
    voto.append(b);
  }
  box.append(t);
  const area = $("textarea", box);
  if (area) area.readOnly = true;
}

// ---------------------------------------------------------------- allenamento
function aggiornaStato() {
  if (!sessione) return;
  const n = sessione.domande.length;
  if (sessione.modo === "allenamento") {
    $("#stato").textContent = "Domanda " + Math.min(sessione.indice + 1, n) + " di " + n;
    $("#barra").style.width = (100 * sessione.indice / n) + "%";
  } else {
    const risposte = sessione.domande.filter((q) => (q.aperta ? (q.testoRisposta || "").trim() : q.scelte.size)).length;
    $("#stato").textContent = "Risposte date: " + risposte + " di " + n;
    $("#barra").style.width = (100 * risposte / n) + "%";
  }
  const fatte = sessione.domande.filter((q) => q.punteggio !== undefined);
  const presi = fatte.reduce((s, q) => s + q.punteggio, 0);
  const massimo = fatte.reduce((s, q) => s + q.punti, 0);
  $("#parziale").textContent = fatte.length ? "Punti: " + numero(presi) + " / " + massimo : "";
}
function disegnaAllenamento() {
  const q = sessione.domande[sessione.indice];
  const contenuto = $("#contenuto");
  contenuto.innerHTML = "";
  $("#timer").hidden = true;
  aggiornaStato();
  const box = costruisciDomanda(q, sessione.indice + 1);
  contenuto.append(box);
  const azioni = elemento("div", { class: "azioni" });
  const verifica = elemento("button", { class: "bottone primario", type: "button" }, q.aperta ? "Mostra la traccia" : "Verifica");
  const avanti = elemento("button", { class: "bottone", type: "button" },
    sessione.indice + 1 < sessione.domande.length ? "Avanti →" : "Vedi il riepilogo");
  avanti.hidden = true;
  verifica.addEventListener("click", () => {
    if (q.aperta) {
      mostraTraccia(q, box, aggiornaStato);
    } else {
      correggi(q, box);
    }
    verifica.hidden = true;
    avanti.hidden = false;
    aggiornaStato();
    avanti.focus({ preventScroll: true });
  });
  avanti.addEventListener("click", () => {
    if (q.aperta && q.punteggio === undefined) q.punteggio = 0;
    sessione.indice += 1;
    if (sessione.indice >= sessione.domande.length) mostraRisultati();
    else { disegnaAllenamento(); window.scrollTo(0, 0); }
  });
  azioni.append(verifica, avanti);
  box.append(azioni);
}
document.addEventListener("keydown", (e) => {
  if (!sessione || sessione.modo !== "allenamento" || $("#sessione").hidden) return;
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey) return;
  const box = $("#contenuto .domanda");
  if (!box) return;
  const k = e.key.toUpperCase();
  const i = LETTERE.indexOf(k) >= 0 ? LETTERE.indexOf(k) : "123456789".indexOf(k);
  const pulsanti = $$(".opzione", box);
  if (i >= 0 && i < pulsanti.length) { pulsanti[i].click(); e.preventDefault(); }
  else if (e.key === "Enter") {
    const visibile = $$(".azioni .bottone", box).find((b) => !b.hidden);
    if (visibile && document.activeElement !== visibile) { visibile.click(); e.preventDefault(); }
  }
});

// ---------------------------------------------------------------- simulazione
function disegnaSimulazione() {
  const contenuto = $("#contenuto");
  contenuto.innerHTML = "";
  const intest = elemento("div", { class: "esame-intestazione" });
  intest.innerHTML = "<strong>Istruzioni:</strong> il tempo a disposizione è di <strong>" + sessione.minuti +
    " minuti</strong>. Nelle domande con più risposte corrette ogni risposta corretta indicata vale una frazione " +
    "del punteggio, e ogni risposta errata comporta una pari penalizzazione; il punteggio di una domanda non è mai negativo.";
  contenuto.append(intest);
  sessione.domande.forEach((q, n) => contenuto.append(costruisciDomanda(q, n + 1)));
  const azioni = elemento("div", { class: "azioni no-stampa" });
  const consegna = elemento("button", { class: "bottone primario", type: "button", id: "consegna" }, "Consegna");
  consegna.addEventListener("click", () => {
    const mancanti = sessione.domande.filter((q) => (q.aperta ? !(q.testoRisposta || "").trim() : !q.scelte.size)).length;
    if (mancanti && !confirm("Ci sono " + mancanti + " domande senza risposta. Consegnare lo stesso?")) return;
    consegnaSimulazione();
  });
  azioni.append(consegna);
  contenuto.append(azioni);
  sessione.fine = Date.now() + sessione.minuti * 60000;
  $("#timer").hidden = false;
  const tic = () => {
    const resto = Math.max(0, sessione.fine - Date.now());
    const m = Math.floor(resto / 60000), s = Math.floor(resto / 1000) % 60;
    $("#timer").textContent = "⏱ " + m + ":" + String(s).padStart(2, "0");
    $("#timer").classList.toggle("poco", resto < 5 * 60000);
    if (resto === 0 && !sessione.consegnata) {
      clearInterval(sessione.intervallo);
      alert("Tempo scaduto: la prova viene consegnata.");
      consegnaSimulazione();
    }
  };
  tic();
  sessione.intervallo = setInterval(tic, 1000);
  aggiornaStato();
}
function consegnaSimulazione() {
  if (sessione.consegnata) return;
  sessione.consegnata = true;
  clearInterval(sessione.intervallo);
  $("#timer").textContent = "Consegnata";
  $("#timer").classList.remove("poco");
  sessione.domande.forEach((q, n) => {
    const box = $("#d" + (n + 1));
    if (q.aperta) mostraTraccia(q, box, () => { aggiornaStato(); aggiornaTotaleSimulazione(); });
    else correggi(q, box);
  });
  $("#consegna").remove();
  const fine = elemento("div", { class: "scheda", id: "esito-simulazione" });
  $("#contenuto").append(fine);
  aggiornaStato();
  aggiornaTotaleSimulazione();
  fine.scrollIntoView({ behavior: "smooth" });
}
function aggiornaTotaleSimulazione() {
  const fine = $("#esito-simulazione");
  if (!fine) return;
  fine.innerHTML = "";
  fine.append(riepilogo(sessione.domande, true));
}

// ---------------------------------------------------------------- risultati
function riepilogo(domande, simulazione) {
  const box = elemento("div");
  const chiuse = domande.filter((q) => !q.aperta);
  const aperte = domande.filter((q) => q.aperta);
  const presi = domande.reduce((s, q) => s + (q.punteggio || 0), 0);
  const massimo = domande.reduce((s, q) => s + q.punti, 0);
  const daValutare = aperte.filter((q) => q.punteggio === undefined).length;
  box.append(elemento("h2", {}, simulazione ? "Esito della prova" : "Riepilogo"));
  box.append(elemento("div", { class: "totale" }, numero(presi) + " / " + massimo));
  let nota = chiuse.length ? "Domande chiuse del tutto giuste: " +
    chiuse.filter((q) => q.punteggio >= q.punti - 1e-9).length + " su " + chiuse.length + "." : "";
  if (daValutare) nota += " Mancano " + daValutare + " autovalutazioni delle domande aperte (sopra, sotto ogni traccia).";
  box.append(elemento("p", { class: "nota" }, nota));
  const righe = {};
  for (const q of domande) {
    const r = righe[q.cap] || (righe[q.cap] = { n: 0, presi: 0, max: 0 });
    r.n += 1; r.presi += q.punteggio || 0; r.max += q.punti;
  }
  let tabella = "<div class=\"tabella-scorre\"><table class=\"riepilogo\"><thead><tr><th>Capitolo</th><th>Domande</th><th class=\"num\">Punti</th></tr></thead><tbody>";
  for (const c of Object.keys(righe).map(Number).sort((a, b) => a - b)) {
    const r = righe[c];
    tabella += "<tr><td>" + c + ". " + DATI.capitoli[c] + "</td><td>" + r.n + "</td><td class=\"num\">" +
      numero(r.presi) + " / " + r.max + "</td></tr>";
  }
  tabella += "</tbody></table></div>";
  box.append(elemento("div", {}, tabella));
  const errate = domande.filter((q) => (q.punteggio || 0) < q.punti - 1e-9).map((q) => q.voce);
  const azioni = elemento("div", { class: "azioni no-stampa" });
  if (errate.length) {
    const ripeti = elemento("button", { class: "bottone primario", type: "button" },
      errate.length === 1 ? "Ripeti la domanda non piena" : "Ripeti le " + errate.length + " domande non piene");
    ripeti.addEventListener("click", () => inizia(mescola(errate).map(prepara), "allenamento", 0));
    azioni.append(ripeti);
  }
  const nuova = elemento("button", { class: "bottone", type: "button" }, "Nuova sessione");
  nuova.addEventListener("click", chiudiSessione);
  azioni.append(nuova);
  box.append(azioni);
  return box;
}
function mostraRisultati() {
  const domande = sessione.domande;
  $("#sessione").hidden = true;
  const r = $("#risultati");
  r.hidden = false;
  r.innerHTML = "";
  const scheda = elemento("div", { class: "scheda" });
  scheda.append(riepilogo(domande, false));
  r.append(scheda);
  if (sessione.intervallo) clearInterval(sessione.intervallo);
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- avvio
disegnaCapitoli();
ripristinaImpostazioni();
aggiornaModo();
aggiornaDisponibili();
</script>
